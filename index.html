<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arx.cr2 | Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(-45deg, #1e3a8a, #0ea5e9, #10b981, #f59e0b, #7c3aed); background-size: 400% 400%; animation: gradient 7s ease infinite; min-height: 100vh; overflow-x: hidden; }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .link-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .link-card:hover { transform: translateY(-4px) scale(1.02); }
        
        /* Smooth zoom transition element styling */
        #transition-box {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            object-fit: cover;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        #fade-overlay {
            position: fixed;
            inset: 0;
            background-color: black;
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }
    </style>
</head>
<body class="antialiased p-4">

    <div id="fade-overlay"></div>
    <img id="transition-box" style="display: none;" src="" alt="">

    <div class="max-w-md mx-auto w-full mt-10">
        <div class="text-center mb-10">
            <div class="w-32 h-32 mx-auto rounded-full bg-white/10 border-4 border-white/30 shadow-2xl flex items-center justify-center overflow-hidden mb-5">
                <img src="11.png" alt="Profile" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/128x128/1e293b/white?text=Arx'">
            </div>
            <h1 class="text-3xl font-bold text-white mb-1 tracking-tight">arx.cr2</h1>
        </div>

        <div class="space-y-6">
            <div class="link-card block overflow-hidden bg-white/10 backdrop-blur-md rounded-2xl shadow-lg border border-white/20" onclick="transition(event, 'https://your-main-website.com')">
                <div class="p-4 text-center border-b border-white/10"><span class="font-semibold text-white">Main Website</span></div>
                <img src="https://placehold.co/600x200/1e293b/white?text=Website+Banner" class="w-full h-32 object-cover card-img">
            </div>

            <div class="link-card block overflow-hidden bg-white/10 backdrop-blur-md rounded-2xl shadow-lg border border-white/20" onclick="transition(event, 'https://soundcloud.com/your-profile')">
                <div class="p-4 text-center border-b border-white/10"><span class="font-semibold text-white">SoundCloud</span></div>
                <img src="https://placehold.co/600x200/f97316/white?text=SoundCloud+Tracks" class="w-full h-32 object-cover card-img">
            </div>

            <div class="link-card block overflow-hidden bg-white/10 backdrop-blur-md rounded-2xl shadow-lg border border-white/20" onclick="transition(event, 'https://discord.gg/your-invite')">
                <div class="p-4 text-center border-b border-white/10"><span class="font-semibold text-white">Discord Server</span></div>
                <img src="https://placehold.co/600x200/5865F2/white?text=Discord+Community" class="w-full h-32 object-cover card-img">
            </div>
        </div>

        <div class="mt-12 text-center text-white/50 text-sm">© 2026 arx.cr2</div>
    </div>

    <script>
        function transition(event, url) {
            const card = event.currentTarget;
            const img = card.querySelector('.card-img');
            const rect = img.getBoundingClientRect();
            
            const transBox = document.getElementById('transition-box');
            const fadeOverlay = document.getElementById('fade-overlay');
            
            // Set initial position matching the clicked image
            transBox.src = img.src;
            transBox.style.display = 'block';
            transBox.style.left = rect.left + 'px';
            transBox.style.top = rect.top + 'px';
            transBox.style.width = rect.width + 'px';
            transBox.style.height = rect.height + 'px';
            
            // Force reflow
            transBox.getBoundingClientRect();
            
            // Trigger zoom & expansion to fill screen
            fadeOverlay.style.opacity = '1';
            transBox.style.left = '0px';
            transBox.style.top = '0px';
            transBox.style.width = '100vw';
            transBox.style.height = '100vh';
            transBox.style.borderRadius = '0px';
            
            setTimeout(() => {
                window.location.href = url;
            }, 750);
        }
    </script>
</body>
</html>
