<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arx.cr2 | Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(-45deg, #1e3a8a, #0ea5e9, #10b981, #f59e0b, #7c3aed); background-size: 400% 400%; animation: gradient 7s ease infinite; min-height: 100vh; }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .link-card { transition: all 0.3s ease; cursor: pointer; }
        .link-card:hover { transform: scale(1.01); }
        #transition-box { position: fixed; z-index: 9999; pointer-events: none; transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); object-fit: cover; border-radius: 0.5rem; display: none; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        #fade-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9998; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
    </style>
</head>
<body class="antialiased p-4">

    <div id="fade-overlay"></div>
    <img id="transition-box" src="" alt="">

    <div class="max-w-md mx-auto w-full mt-10">
        <div class="text-center mb-8">
            <div id="profile-container" class="w-24 h-24 mx-auto rounded-full bg-white/20 border-2 border-white/30 shadow-xl overflow-hidden mb-4"></div>
            <h1 class="text-2xl font-bold text-white mb-2">arx.cr2</h1>
            <div id="social-container" class="flex justify-center gap-6 text-2xl mb-6"></div>
        </div>

        <div id="links-container" class="space-y-4"></div>
        <div class="mt-12 text-center text-white/50 text-xs">© 2026 arx.cr2</div>
    </div>

    <script>
        const CONFIG = {
            profilePic: "profile.png",
            socialIcons: [
                { emoji: "📸", url: "#" },
                { emoji: "🎵", url: "#" },
                { emoji: "✖️", url: "#" }
            ],
            links: [
                { label: "Main Website", url: "https://your-main-website.com", img: "website.jpg" },
                { label: "SoundCloud", url: "https://soundcloud.com/your-profile", img: "soundcloud.jpg" }
            ]
        };

        // Render Profile
        document.getElementById('profile-container').innerHTML = `<img src="${CONFIG.profilePic}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/128x128/1e293b/white?text=Profile'">`;

        // Render Socials
        const socialCont = document.getElementById('social-container');
        CONFIG.socialIcons.forEach(s => socialCont.innerHTML += `<a href="${s.url}" class="hover:opacity-75 transition-opacity">${s.emoji}</a>`);

        // Render Links
        const container = document.getElementById('links-container');
        CONFIG.links.forEach(link => {
            container.innerHTML += `
                <div class="link-card overflow-hidden bg-white/10 backdrop-blur-sm border border-white/20 rounded-lg" onclick="transition(event, '${link.url}')">
                    <div class="p-3 text-center border-b border-white/10 text-white font-semibold">${link.label}</div>
                    <img src="${link.img}" class="w-full h-32 object-cover card-img" onerror="this.src='https://placehold.co/600x200/1e293b/white?text=Err+${link.img}'">
                </div>
            `;
        });

        function transition(event, url) {
            const card = event.currentTarget;
            const img = card.querySelector('.card-img');
            const rect = img.getBoundingClientRect();
            const transBox = document.getElementById('transition-box');
            const fadeOverlay = document.getElementById('fade-overlay');
            
            transBox.src = img.src;
            transBox.style.display = 'block';
            transBox.style.left = rect.left + 'px';
            transBox.style.top = rect.top + 'px';
            transBox.style.width = rect.width + 'px';
            transBox.style.height = rect.height + 'px';
            
            transBox.getBoundingClientRect(); // Reflow
            
            fadeOverlay.style.opacity = '1';
            transBox.style.left = '0px';
            transBox.style.top = '0px';
            transBox.style.width = '100vw';
            transBox.style.height = '100vh';
            transBox.style.borderRadius = '0px';
            
            setTimeout(() => { window.location.href = url; }, 600);
        }

        window.onpageshow = () => {
            document.getElementById('fade-overlay').style.opacity = '0';
            document.getElementById('transition-box').style.display = 'none';
        };
    </script>
</body>
</html>
